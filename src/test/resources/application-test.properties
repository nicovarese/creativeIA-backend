spring.datasource.url=jdbc:h2:mem:creativeai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

storage.assetsDir=./target/test-assets
comfy.baseUrl=http://127.0.0.1:8188
comfy.inputDir=./target/test-comfy-input
comfy.downloadDir=./target/test-comfy-download
creativeai.generation.fallback-to-mock-on-error=true

app.jwt.secret=test_secret_that_is_long_enough_for_hs256
app.jwt.expiresMinutes=120
app.publicBaseUrl=http://localhost:8080
app.cors.allowed-origins=http://127.0.0.1:4200,http://localhost:4200
