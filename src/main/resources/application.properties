spring.application.name=creativeai

# Puerto del backend
server.port=8080

# Configuraci�n de conexi�n a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Config JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Storage local
storage.assetsDir=./assets

# Perfil dev usa MockImageProvider (y no requiere GPU)
spring.profiles.active=dev

# Base dentro del classpath donde viven tus plantillas y esquemas
creativeai.templates.base-path=templates/
# Falla si no existe el recurso (true) o devolv�mos null en los m�todos *OrNull (false)
creativeai.templates.fail-on-missing=true

# ComfyUIAdapter config
comfy.baseUrl=http://127.0.0.1:8188
comfy.inputDir=C:/Users/renzo/StabilityMatrix-win-x64/Data/Packages/ComfyUI/input
comfy.downloadDir=./tmp/comfy

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# App - JWT
app.jwt.secret=CAMBIAME_por_un_secret_largo_de_al_menos_32_chars
app.jwt.expiresMinutes=120
