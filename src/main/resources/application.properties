spring.application.name=creativeai
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/creativeai;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

storage.assetsDir=${STORAGE_ASSETS_DIR:./assets}

creativeai.templates.base-path=templates/
creativeai.templates.fail-on-missing=true
creativeai.generation.fallback-to-mock-on-error=${GENERATION_FALLBACK_TO_MOCK:true}

comfy.baseUrl=${COMFY_BASE_URL:http://127.0.0.1:8188}
comfy.inputDir=${COMFY_INPUT_DIR:C:/Users/renzo/StabilityMatrix-win-x64/Data/Packages/ComfyUI/input}
comfy.downloadDir=${COMFY_DOWNLOAD_DIR:./tmp/comfy}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${APP_JWT_SECRET:creativeai_local_dev_secret_at_least_32_chars}
app.jwt.expiresMinutes=${APP_JWT_EXPIRES_MINUTES:120}
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:http://localhost:${server.port}}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4200,http://localhost:4200}

# ---------- Brand LoRA training (ai-toolkit) ----------
# Apagado por default. Para activar el trainer real:
#   1) Seguí docs/AI_TOOLKIT_SETUP.md (clonar ai-toolkit, venv, descargar Flux.2 Dev).
#   2) Seteá las rutas absolutas reales en las 2 vars de abajo.
#   3) Encendé el flag: AITOOLKIT_ENABLED=true
creativeai.training.aitoolkit.enabled=${AITOOLKIT_ENABLED:false}
creativeai.training.aitoolkit.repoPath=${AITOOLKIT_REPO_PATH:./ai-toolkit}
creativeai.training.aitoolkit.pythonPath=${AITOOLKIT_PYTHON_PATH:./ai-toolkit/venv/Scripts/python.exe}
creativeai.training.aitoolkit.baseModel=${AITOOLKIT_BASE_MODEL:black-forest-labs/FLUX.2-dev}
creativeai.training.aitoolkit.steps=${AITOOLKIT_STEPS:3000}
creativeai.training.aitoolkit.outputBase=${AITOOLKIT_OUTPUT_BASE:./training/output}
creativeai.training.datasetsDir=${TRAINING_DATASETS_DIR:./training/datasets}
creativeai.training.lorasDir=${TRAINING_LORAS_DIR:./training/loras}
creativeai.training.gpuTimeoutHours=${TRAINING_GPU_TIMEOUT_HOURS:6}
