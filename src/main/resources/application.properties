spring.application.name=creativeai
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

storage.assetsDir=${STORAGE_ASSETS_DIR:./assets}

creativeai.templates.base-path=templates/
creativeai.templates.fail-on-missing=true
creativeai.generation.fallback-to-mock-on-error=${GENERATION_FALLBACK_TO_MOCK:true}

comfy.baseUrl=${COMFY_BASE_URL:http://127.0.0.1:8188}
comfy.inputDir=${COMFY_INPUT_DIR:./ComfyUI/input}
comfy.downloadDir=${COMFY_DOWNLOAD_DIR:./tmp/comfy}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${APP_JWT_SECRET:change_me_with_a_secret_of_at_least_32_chars}
app.jwt.expiresMinutes=${APP_JWT_EXPIRES_MINUTES:120}
app.publicBaseUrl=${APP_PUBLIC_BASE_URL:http://localhost:${server.port}}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4200,http://localhost:4200}
