spring.application.name=creativeai

# Puerto del backend
server.port=8080

# Configuración de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Config JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Storage local
storage.assetsDir=./assets

# Perfil dev usa MockImageProvider (y no requiere GPU)
spring.profiles.active=dev

# Base dentro del classpath donde viven tus plantillas y esquemas
creativeai.templates.base-path=templates/
# Falla si no existe el recurso (true) o devolvémos null en los métodos *OrNull (false)
creativeai.templates.fail-on-missing=true